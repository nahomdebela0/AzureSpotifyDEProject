# This is a Declarative Automation Bundle definition for spotify_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: spotify_dab
  uuid: 89511826-fc4e-48c9-8540-e2fcb3f737b4


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: adb-7405614576590384.4.azuredatabricks.net
      root_path: /Workspace/Users/debelanahom@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: spotify_catalog
      schema: ${workspace.current_user.short_name}
    presets: 
      source_linked_deployment: false


  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/debelanahom@yahoo.com to make sure we only have a single copy.
      root_path: /Workspace/Users/debelanahom@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: spotify_catalog
      schema: prod
    permissions:
      - user_name: debelanahom@yahoo.com
        level: CAN_MANAGE
